<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Week 4: JavaScript Fundamentals</title>
</head>
<body>
  <h1>Week 4: JavaScript Fundamentals</h1>
  <h2>Calculator</h2>
<form id="calc-form">
  <input type="number" id="num1" step="any" placeholder="First number" required>
  <select id="operator">
    <option value="+">+</option>
    <option value="-">-</option>
    <option value="*">*</option>
    <option value="/">/</option>
    <option value="%">%</option>
    <option value="**">**</option>
  </select>
  <input type="number" id="num2" step="any" placeholder="Second number" required>
  <button type="submit">Calculate</button>
</form>
<p id="calc-result"></p>
  <script src="main.js"></script>
</body>
</html>
